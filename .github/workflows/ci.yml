name: Build for CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_VERSION: '10.0.x' # The .NET SDK version to use

jobs:
  build-plugin-ci:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Install .NET MAUI Workload
      run: dotnet workload restore samples\Plugin.Maui.FitText.Sample.sln

    - name: Build
      run: dotnet build src\Plugin.Maui.FitText.sln -c Release -p:UseMinimumMauiVersion=true

    # Makes sure that the package builds. The release workflow does the real pack on a version tag.
    - name: Pack
      run: dotnet pack src\Plugin.Maui.FitText.sln -c Release -p:UseMinimumMauiVersion=true --no-build -p:PackageVersion=0.0.0-ci.${{ github.run_number }} -o artifacts

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: artifacts/*.nupkg
